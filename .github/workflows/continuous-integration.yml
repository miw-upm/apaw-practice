name: CI
on:
  push:
    branches:
      - develop
      - release-*

jobs:
  ci:
    name: Tests & CodeQL & SonarCloud
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended

      - name: ✅ Run Unit Test & Integration Test & Functional Test
        run: mvn -B verify -Dspring.profiles.active=test

      - name: 🔔 Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,author,commit,author,workflow,
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

      # Organización de la cuenta de Sonar: miw-upm-github
      - name: 🏷️ Extract artifact from pom & Sonar Organization
        run: |
          echo "ORGANIZATION=miw-upm-github" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV

      - name: 📊 Sonar Analysis
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=${{ env.ORGANIZATION }}_${{ env.ARTIFACT }}
          -Dsonar.organization=${{ env.ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io 
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
